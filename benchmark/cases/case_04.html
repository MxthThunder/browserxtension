<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><title>DigiLocker — Identity Document Preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;padding:40px 20px;display:flex;flex-direction:column;align-items:center}
h1{font-size:20px;color:#1a202c;margin-bottom:8px}
.sub{color:#718096;font-size:13px;margin-bottom:28px}
.doc-frame{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
img{display:block;border-radius:4px}
.caption{font-size:11px;color:#a0aec0;margin-top:10px;text-align:center}
</style>
</head>
<body>
<h1>Aadhaar Card Preview</h1>
<p class="sub">Your uploaded ID document is displayed below. This is a static image — not a form field.</p>
<div class="doc-frame">
  <img id="aadhaar-img" alt="aadhaar identity card" width="480" height="200"/>
  <p class="caption">Aadhaar Card — Government of India</p>
</div>
<script>
window.__BM_PAGE_LOAD_T0 = Date.now();
// Programmatically generate the Aadhaar card as a canvas and convert to img src
// This simulates a "document preview" where PII is baked into pixel data
const c = document.createElement('canvas');
c.width = 480; c.height = 200;
const ctx = c.getContext('2d');

// Card background gradient
const grad = ctx.createLinearGradient(0,0,480,0);
grad.addColorStop(0,'#1565C0'); grad.addColorStop(1,'#0D47A1');
ctx.fillStyle = grad; ctx.fillRect(0,0,480,200);

// White card body
ctx.fillStyle = '#fff'; ctx.beginPath();
ctx.roundRect(12,12,456,176,6); ctx.fill();

// UIDAI header
ctx.fillStyle = '#1565C0'; ctx.font = 'bold 11px Arial';
ctx.fillText('भारत सरकार / Government of India', 20, 36);
ctx.fillStyle = '#e53e3e'; ctx.font = 'bold 12px Arial';
ctx.fillText('Unique Identification Authority of India', 20, 52);

// Face placeholder
ctx.fillStyle = '#90caf9';
ctx.fillRect(370, 30, 85, 110);
ctx.fillStyle = '#fff'; ctx.font = '10px Arial';
ctx.fillText('Photo', 398, 90);

// PII text (baked into pixels)
ctx.fillStyle = '#1a202c'; ctx.font = 'bold 14px Arial';
ctx.fillText('ANJALI SHARMA', 20, 90);
ctx.fillStyle = '#555'; ctx.font = '12px Arial';
ctx.fillText('DOB: 14/07/1992', 20, 112);
ctx.fillText('Gender: Female', 20, 132);
ctx.fillStyle = '#1565C0'; ctx.font = 'bold 22px "Courier New"';
ctx.fillText('9876  5432  1098', 20, 165);
ctx.fillStyle = '#777'; ctx.font = '10px Arial';
ctx.fillText('Aadhaar Number', 20, 180);

// Convert to img
document.getElementById('aadhaar-img').src = c.toDataURL('image/png');
</script>
</body>
</html>
