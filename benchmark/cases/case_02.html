<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><title>SecurePay Checkout — Payment Details</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f7fafc;padding:40px 20px}
.container{max-width:560px;margin:0 auto}
h1{font-size:22px;font-weight:700;color:#1a202c;margin-bottom:24px}
.section{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:24px;margin-bottom:16px}
.section-title{font-size:13px;font-weight:700;color:#4a5568;text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:12px;font-weight:600;color:#718096;margin-bottom:5px}
input,select{width:100%;border:1px solid #e2e8f0;border-radius:5px;padding:9px 12px;font-size:14px;color:#2d3748;outline:none;margin-bottom:14px}
input:focus,select:focus{border-color:#6366f1}
.btn{width:100%;padding:14px;background:#6366f1;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer}
.secure-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:#48bb78;margin-top:12px;justify-content:center}
</style>
</head>
<body>
<div class="container">
  <h1>Complete Your Order</h1>
  <div class="section">
    <div class="section-title">Contact Information</div>
    <label>Full Name</label>
    <input type="text" autocomplete="name" placeholder="Ravi Kumar Sharma"/>
    <label>Email Address</label>
    <input type="email" autocomplete="email" placeholder="ravi.sharma@gmail.com"/>
  </div>
  <div class="section">
    <div class="section-title">Payment Details</div>
    <label>Card Number</label>
    <input type="text" autocomplete="cc-number" placeholder="4532 7512 8934 1123" maxlength="19"/>
    <div class="row">
      <div>
        <label>Expiry Date</label>
        <input type="text" autocomplete="cc-exp" placeholder="MM / YY"/>
      </div>
      <div>
        <label>CVV Security Code</label>
        <input type="text" name="cvv" autocomplete="cc-csc" placeholder="123" maxlength="4"/>
      </div>
    </div>
    <label>Cardholder Name</label>
    <input type="text" autocomplete="cc-name" placeholder="RAVI K SHARMA"/>
  </div>
  <div class="section">
    <div class="section-title">Billing Address</div>
    <label>Street Address</label>
    <input type="text" autocomplete="street-address" placeholder="12, MG Road, Indiranagar"/>
    <div class="row">
      <div><label>PIN Code</label><input type="text" autocomplete="postal-code" placeholder="560038"/></div>
      <div><label>Mobile</label><input type="tel" autocomplete="tel" placeholder="+91 98450 12345"/></div>
    </div>
  </div>
  <button class="btn">Pay ₹4,299 Securely</button>
  <div class="secure-badge">🔒 256-bit SSL Encrypted · PCI-DSS Compliant</div>
</div>
</body>
</html>
