<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Privacy Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup" id="popup">

    <!-- Header -->
    <header class="topbar">
      <div class="brand">
        <span class="shield-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V7L12 2z" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-name">Privacy Agent</span>
      </div>

      <div class="topbar-right">
        <!-- Theme toggle -->
        <button id="btnTheme" class="icon-btn" title="Toggle light/dark mode" aria-label="Toggle theme">
          <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>

        <!-- Settings link -->
        <button id="btnOpenOptions" class="icon-btn" title="Settings" aria-label="Open settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── BASIC VIEW ── -->

    <!-- Protection Hero -->
    <section class="hero-card" id="heroCard">
      <div class="hero-content">
        <div class="hero-text">
          <div class="status-row">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-label" id="statusText">Protected</span>
          </div>
          <p class="hero-caption" id="basicCount">Hides passwords, cards, IDs and faces from AI browsing tools before they leave your device.</p>
        </div>
        <button id="toggleProtection" class="toggle-btn active" data-state="on" aria-pressed="true" aria-label="Toggle protection">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </button>
      </div>
      <p class="page-notice" id="pageNotice">Nothing sensitive found on this page.</p>
    </section>

    <!-- Prompt Box -->
    <section class="prompt-card">
      <label class="prompt-label" for="taskInput">What do you want done?</label>
      <div class="prompt-row">
        <div class="prompt-input-wrap">
          <input
            type="text"
            id="taskInput"
            class="prompt-input"
            placeholder="e.g. Fill the application form and submit"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <button id="btnDispatchTask" class="btn-go" aria-label="Run task">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
        <button id="btnStopTask" class="btn-stop hidden" aria-label="Stop task">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <rect x="4" y="4" width="16" height="16" rx="2"/>
          </svg>
        </button>
      </div>

      <!-- Step feed — plain english progress -->
      <div id="stepFeed" class="step-feed"></div>

      <!-- Server offline notice -->
      <p id="lblServerStatus" class="server-notice hidden"></p>
    </section>

    <!-- Advanced toggle -->
    <label class="adv-toggle-row" for="chkAdvanced">
      <span class="adv-toggle-label">Advanced</span>
      <span class="switch">
        <input type="checkbox" id="chkAdvanced" />
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </span>
    </label>

    <!-- ── ADVANCED PANEL ── -->
    <div class="adv-panel" id="advancedPanel">

      <!-- Reasoner selector -->
      <div class="adv-section">
        <label class="adv-label" for="selModelProvider">AI Model</label>
        <select id="selModelProvider" class="select">
          <option value="auto">Auto (Best Available)</option>
          <option value="ollama_qwen">Ollama: Local (Offline)</option>
          <option value="gemini">Google Gemini 2.5 Flash</option>
          <option value="nlp">Offline Semantic Engine</option>
        </select>
      </div>

      <!-- Quick actions -->
      <div class="adv-section">
        <span class="adv-label">Page Tools</span>
        <div class="actions-grid">
          <button id="btnCapture" class="btn-tool">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="15" rx="2"/><path d="M16 2l-4 4-4-4"/></svg>
            Capture
          </button>
          <button id="btnHighlightDOM" class="btn-tool">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
            Highlight
          </button>
          <button id="btnClearOverlays" class="btn-tool">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            Clear
          </button>
          <button id="btnAutoSync" class="btn-tool">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Live
          </button>
        </div>
      </div>

      <!-- Sanitized preview -->
      <div class="adv-section">
        <div class="adv-label-row">
          <span class="adv-label">Sanitized Preview</span>
          <span id="redactionCountPill" class="badge">0 masked</span>
        </div>
        <div class="seg-row">
          <button id="btnViewSanitized" class="seg active">Sanitized</button>
          <button id="btnViewRaw" class="seg">Raw</button>
        </div>
        <div class="preview-box" id="previewBox">
          <img id="displayImage" class="preview-img" alt="Captured viewport" style="display:none" />
          <div id="viewportPlaceholder" class="preview-placeholder">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>Awaiting capture</span>
          </div>
        </div>
        <div id="visualRedactionList" class="detected-list">
          <span class="muted-sm">No sensitive entities detected.</span>
        </div>
      </div>

      <!-- Activity log -->
      <div class="adv-section">
        <span class="adv-label">Activity Log</span>
        <div id="agentStatusLog" class="log-box">
          <div class="log-entry">System ready.</div>
        </div>
      </div>

      <!-- Footer links -->
      <div class="adv-footer">
        <span id="linkOpenDashboard" class="text-link">Analytics</span>
        <span class="sep">·</span>
        <span id="linkOpenDemo" class="text-link">Test Lab</span>
        <span class="sep">·</span>
        <button id="btnOpenHUD" class="text-link btn-unstyled">HUD</button>
      </div>
    </div>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
