<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Privacy Agent</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="topbar">
      <h1>Privacy Agent</h1>
      <button id="btnOpenSidePanel" class="icon-btn" title="Dock to Side Panel" aria-label="Dock to Side Panel">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
      </button>
    </header>

    <section class="hero">
      <button id="toggleProtection" class="hero-toggle" data-state="on" aria-pressed="true" aria-label="Toggle protection">
        <span class="hero-toggle-track"><span class="hero-toggle-thumb"></span></span>
      </button>
      <div class="hero-text">
        <p class="hero-status" id="statusText">Protected</p>
        <p class="hero-desc">Hides passwords, cards, IDs and faces from AI browsing tools before they leave your device.</p>
      </div>
      <p class="hero-count" id="basicCount">Checking this page…</p>
    </section>

    <section class="panel prompt-panel">
      <label class="field-label" for="taskInput">What do you want done?</label>
      <div class="field-row">
        <input
          type="text"
          id="taskInput"
          class="input"
          placeholder="e.g. Fill the form and submit"
        />
        <button id="btnDispatchTask" class="btn-primary">Go</button>
      </div>
      <p id="lblServerStatus" class="hint hidden"></p>
      <div id="stepFeed" class="step-feed"></div>
    </section>

    <label class="advanced-row">
      <span>Advanced</span>
      <span class="switch">
        <input type="checkbox" id="chkAdvanced" />
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </span>
    </label>

    <div class="advanced-panel" id="advancedPanel">
      <div class="advanced-inner">

        <section class="panel">
          <div class="field-row space-between">
            <span class="field-label-inline">Reasoner</span>
            <select id="selModelProvider" class="select">
              <option value="auto">Auto</option>
              <option value="gemini">Gemini</option>
              <option value="ollama_qwen">Ollama (local)</option>
              <option value="nlp">Offline</option>
            </select>
          </div>
        </section>

        <section class="panel actions-row">
          <button id="btnCapture" class="btn-ghost">Capture</button>
          <button id="btnHighlightDOM" class="btn-ghost">Highlight</button>
          <button id="btnClearOverlays" class="btn-ghost">Clear</button>
          <button id="btnAutoSync" class="btn-ghost">Live</button>
        </section>

        <details class="panel disclosure">
          <summary>
            <span>Preview</span>
            <span id="redactionCountPill" class="muted">0 masked</span>
          </summary>
          <div class="disclosure-body">
            <div class="segmented">
              <button id="btnViewSanitized" class="seg active">Sanitized</button>
              <button id="btnViewRaw" class="seg">Raw</button>
            </div>
            <div class="viewport">
              <img id="displayImage" class="viewport-img" alt="Captured viewport" />
              <div id="viewportPlaceholder" class="placeholder">No capture yet</div>
            </div>
            <div id="visualRedactionList" class="detected-list">
              <div class="muted">Nothing detected yet.</div>
            </div>
          </div>
        </details>

        <details class="panel disclosure">
          <summary><span>Activity</span></summary>
          <div id="agentStatusLog" class="log">
            <div class="log-entry">Ready.</div>
          </div>
        </details>

        <div class="footer-inline">
          <span id="linkOpenDemo" class="link">Open demo page</span>
        </div>
      </div>
    </div>

    <footer class="footer">
      <span id="linkOpenDashboard" class="link">Analytics Dashboard</span>
      <span class="footer-dot">•</span>
      <span id="linkOpenOptions" class="link">Settings</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
