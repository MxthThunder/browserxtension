<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PriviBrowse</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">

    <!-- ── Topbar ────────────────────────────────────── -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </span>
        <h1>PriviBrowse</h1>
      </div>
      <div class="topbar-right">
        <!-- Light / Dark toggle -->
        <button id="btnTheme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg id="iconMoon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg id="iconSun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <!-- Side panel dock -->
        <button id="btnOpenSidePanel" class="icon-btn" title="Dock to side panel" aria-label="Dock to side panel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="15" y1="3" x2="15" y2="21"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── Hero — protection toggle ──────────────────── -->
    <section class="hero">
      <button
        id="toggleProtection"
        class="hero-toggle"
        data-state="on"
        aria-pressed="true"
        aria-label="Toggle protection"
      >
        <svg class="hero-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </button>
      <div class="hero-text">
        <p class="hero-status" id="statusText">Protected</p>
        <p class="hero-desc">Sensitive data &amp; faces are masked on-device before any AI sees them.</p>
        <p class="hero-count" id="basicCount">Checking this page…</p>
      </div>
    </section>

    <!-- ── Prompt — the primary action ───────────────── -->
    <section class="prompt-section">
      <p class="prompt-label">What do you want done?</p>
      <div class="prompt-row">
        <input
          type="text"
          id="taskInput"
          class="input"
          placeholder="e.g. Fill the form and submit"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="btnDispatchTask" class="btn-primary">Run</button>
      </div>
      <p id="lblServerStatus" class="hint hidden"></p>
      <div id="stepFeed" class="step-feed"></div>
    </section>

    <!-- ── Advanced toggle ────────────────────────────── -->
    <label class="advanced-row" for="chkAdvanced">
      <span class="advanced-row-label">Advanced</span>
      <span class="switch">
        <input type="checkbox" id="chkAdvanced" />
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </span>
    </label>

    <!-- ── Advanced panel ─────────────────────────────── -->
    <div class="advanced-panel" id="advancedPanel">
      <div class="advanced-inner">

        <!-- Reasoner selector -->
        <section class="panel">
          <div class="field-row">
            <span class="field-label-inline">Reasoner</span>
            <select id="selModelProvider" class="select">
              <option value="ollama_qwen" selected>Qwen (Ollama local)</option>
              <option value="auto">Auto (Qwen > Gemini)</option>
              <option value="gemini">Gemini</option>
              <option value="nlp">Offline NLP</option>
            </select>
          </div>
        </section>

        <!-- Quick actions -->
        <section class="panel actions-row">
          <button id="btnCapture"       class="btn-ghost">Capture</button>
          <button id="btnHighlightDOM"  class="btn-ghost">Highlight</button>
          <button id="btnClearOverlays" class="btn-ghost">Clear</button>
          <button id="btnAutoSync"      class="btn-ghost">Live</button>
        </section>

        <!-- Preview -->
        <details class="panel disclosure">
          <summary>
            <span>Preview</span>
            <span id="redactionCountPill" class="muted">0 masked</span>
          </summary>
          <div class="disclosure-body">
            <div class="segmented">
              <button id="btnViewSanitized" class="seg active">Sanitized</button>
              <button id="btnViewRaw"       class="seg">Raw</button>
            </div>
            <div class="viewport">
              <img id="displayImage" class="viewport-img" alt="Captured viewport" />
              <div id="viewportPlaceholder" class="placeholder">No capture yet</div>
            </div>
            <div id="visualRedactionList" class="detected-list">
              <div class="muted">Nothing detected yet.</div>
            </div>
          </div>
        </details>

        <!-- Activity log -->
        <details class="panel disclosure">
          <summary><span>Activity log</span></summary>
          <div class="disclosure-body">
            <div id="agentStatusLog" class="log">
              <div class="log-entry">Ready.</div>
            </div>
          </div>
        </details>

        <div class="footer-inline">
          <span id="linkOpenDemo" class="link">Open demo page</span>
        </div>

      </div>
    </div>

    <!-- ── Footer ─────────────────────────────────────── -->
    <footer class="footer">
      <span id="linkOpenDashboard" class="link">Dashboard</span>
      <span class="footer-dot">·</span>
      <span id="linkOpenOptions" class="link">Settings</span>
    </footer>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
