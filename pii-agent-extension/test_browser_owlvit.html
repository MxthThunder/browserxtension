<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Browser OWL-ViT Diagnostics</title>
</head>
<body style="background:#111; color:#eee; font-family:sans-serif; padding:20px;">
  <h1>OWL-ViT In-Browser Diagnostic Test</h1>
  <div id="status" style="font-size:18px; margin-bottom:15px; color:#38bdf8;">Status: Starting...</div>
  <pre id="log" style="background:#222; padding:15px; border-radius:8px; max-height:500px; overflow:auto;"></pre>

  <script type="module">
    const logEl = document.getElementById("log");
    const statusEl = document.getElementById("status");

    function log(msg) {
      console.log(msg);
      logEl.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
    }

    try {
      log("Importing transformers.min.js...");
      const { pipeline, env, RawImage } = await import("./lib/transformers.min.js");
      log("Transformers.js imported successfully.");

      env.allowLocalModels = true;
      env.allowRemoteModels = false;
      env.useBrowserCache = false;
      env.localModelPath = "http://localhost:8000/models/";
      
      if (!env.backends) env.backends = {};
      if (!env.backends.onnx) env.backends.onnx = {};
      if (!env.backends.onnx.wasm) env.backends.onnx.wasm = {};
      env.backends.onnx.wasm.numThreads = 1;
      env.backends.onnx.wasm.wasmPaths = "http://localhost:8000/lib/";

      log(`Configured env: localModelPath=${env.localModelPath}, wasmPaths=${env.backends.onnx.wasm.wasmPaths}, numThreads=${env.backends.onnx.wasm.numThreads}`);

      statusEl.textContent = "Status: Loading OWL-ViT Pipeline...";
      const t0 = performance.now();
      log("Calling pipeline('zero-shot-object-detection', 'Xenova/owlvit-base-patch32', { device: 'wasm' })...");

      const detector = await pipeline("zero-shot-object-detection", "Xenova/owlvit-base-patch32", {
        device: "wasm"
      });

      const dt = Math.round(performance.now() - t0);
      log(`Pipeline loaded in ${dt}ms! Detector ready: ${Boolean(detector)}`);
      statusEl.textContent = `Status: Success (${dt}ms)`;
      statusEl.style.color = "#4ade80";

      // Test inference on a tiny dummy canvas
      const testCanvas = document.createElement("canvas");
      testCanvas.width = 300;
      testCanvas.height = 300;
      const ctx = testCanvas.getContext("2d");
      ctx.fillStyle = "blue";
      ctx.fillRect(0,0,300,300);
      const dataUrl = testCanvas.toDataURL("image/png");

      log("Running test inference...");
      const tInf0 = performance.now();
      const rawImg = await RawImage.fromURL(dataUrl);
      const results = await detector(rawImg, ["credit card", "document"], { threshold: 0.1 });
      const dtInf = Math.round(performance.now() - tInf0);
      log(`Inference completed in ${dtInf}ms. Detections: ${results.length}`);
      log("TEST COMPLETE: EVERYTHING WORKS!");
    } catch (err) {
      log(`ERROR: ${err.message}\nStack: ${err.stack}`);
      statusEl.textContent = `Status: FAILED (${err.message})`;
      statusEl.style.color = "#f87171";
    }
  </script>
</body>
</html>
