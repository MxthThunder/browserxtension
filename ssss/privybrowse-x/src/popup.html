<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light; }
  body {
    width: 268px; margin: 0; padding: 14px;
    font: 13px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #16150f; background: #fff;
  }
  h1 { font-size: 13px; margin: 0 0 2px; font-weight: 650; }
  .sub { font-size: 11px; color: #6b6a63; margin-bottom: 12px; }
  button {
    width: 100%; padding: 8px; margin-bottom: 6px; font: inherit; font-size: 12px;
    border: 1px solid #e3e2dc; border-radius: 6px; background: #fff;
    cursor: pointer; text-align: left; padding-left: 12px;
  }
  button:hover:not(:disabled) { background: #f4f3ee; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: #16150f; color: #fff; border-color: #16150f; }
  button.primary:hover:not(:disabled) { background: #333127; }
  .row { display: flex; justify-content: space-between; align-items: center;
         font-size: 11px; padding: 3px 0; }
  .row .k { color: #6b6a63; }
  .row .v { font-family: ui-monospace, monospace; }
  .badge { font: 600 10px/1 ui-monospace, monospace; padding: 3px 6px;
           border-radius: 3px; text-transform: uppercase; }
  .webgpu { background: #d6f5e3; color: #1a7f4b; }
  .wasm   { background: #fdf0d0; color: #8a6100; }
  .none   { background: #f6dcd8; color: #c0392b; }
  hr { border: 0; border-top: 1px solid #e3e2dc; margin: 10px 0; }
  #status { font-size: 11px; color: #6b6a63; min-height: 30px; }
</style>
</head>
<body>
  <h1>PrivyBrowse X</h1>
  <div class="sub">On-device perception &amp; PII redaction</div>

  <div class="row">
    <span class="k">Backend</span>
    <span id="backend" class="badge none">checking</span>
  </div>
  <div class="row"><span class="k">Model load</span><span class="v" id="loadMs">—</span></div>

  <hr />

  <button id="scan" class="primary">Highlight sensitive fields</button>
  <button id="clear">Clear highlights</button>
  <button id="hud">Open live redaction HUD</button>

  <hr />
  <div id="status">Ready.</div>

  <script src="popup.js"></script>
</body>
</html>
